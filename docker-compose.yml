services:
  llm-pulse:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-pulse:local
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for container startup}
      PORT: "43130"
      BFF_BIND_HOST: "0.0.0.0"
      PULSE_REFRESH_INTERVAL_MS: ${PULSE_REFRESH_INTERVAL_MS:-20000}
      AVAILABILITY_WINDOW_SECONDS: ${AVAILABILITY_WINDOW_SECONDS:-3600}
      PULSE_QUERY_TIMEOUT_MS: ${PULSE_QUERY_TIMEOUT_MS:-5000}
      PULSE_DB_POOL_MAX: ${PULSE_DB_POOL_MAX:-5}
      PULSE_DB_IDLE_TIMEOUT_MS: ${PULSE_DB_IDLE_TIMEOUT_MS:-30000}
      PULSE_DB_CONN_TIMEOUT_MS: ${PULSE_DB_CONN_TIMEOUT_MS:-2000}
      PULSE_SNAPSHOT_ENABLED: ${PULSE_SNAPSHOT_ENABLED:-false}
      PULSE_SNAPSHOT_PATH: ${PULSE_SNAPSHOT_PATH:-apps/server/data/pulse-snapshot.sqlite}
      PULSE_RECONCILE_SECONDS: ${PULSE_RECONCILE_SECONDS:-120}
      PULSE_BOOTSTRAP_BATCH_SIZE: ${PULSE_BOOTSTRAP_BATCH_SIZE:-1000}
    ports:
      - "127.0.0.1:43130:43130"
    volumes:
      - llm-pulse-data:/app/apps/server/data
    restart: unless-stopped

volumes:
  llm-pulse-data:

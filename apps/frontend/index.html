<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="LLM Pulse - Model 可用性 Snapshot Dashboard。"
    />
    <meta name="theme-color" content="#10b981" />
    <meta name="application-name" content="LLM Pulse" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LLM Pulse" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/status/favicon.svg" />
    <link rel="apple-touch-icon" href="/status/icon.svg" />
    <link rel="manifest" href="/status/manifest.webmanifest" />
    <title>LLM Pulse | Model Snapshot</title>
    <script>
      (() => {
        const storageKey = "llm-pulse-theme-preference";

        try {
          const storedValue = window.localStorage.getItem(storageKey);
          const systemTheme = window.matchMedia("(prefers-color-scheme: dark)")
            .matches
            ? "dark"
            : "light";
          const theme =
            storedValue === "light" || storedValue === "dark"
              ? storedValue
              : systemTheme;

          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          const fallbackTheme = window.matchMedia("(prefers-color-scheme: dark)")
            .matches
            ? "dark"
            : "light";

          document.documentElement.dataset.theme = fallbackTheme;
          document.documentElement.style.colorScheme = fallbackTheme;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

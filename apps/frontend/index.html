<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="状态监控 - Model 可用性 Snapshot Dashboard。"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@400;500;600;700&display=swap"
    />
    <meta name="theme-color" content="#faf9f5" />
    <meta name="application-name" content="状态监控" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="状态监控" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/status/favicon.svg" />
    <link rel="apple-touch-icon" href="/status/icon.svg" />
    <link rel="manifest" href="/status/manifest.webmanifest" />
    <title>状态监控 | Model Snapshot</title>
    <script>
      (() => {
        const storageKey = "llm-pulse-theme-preference";

        try {
          const storedValue = window.localStorage.getItem(storageKey);
          const systemTheme = window.matchMedia("(prefers-color-scheme: dark)")
            .matches
            ? "dark"
            : "light";
          const theme =
            storedValue === "light" || storedValue === "dark"
              ? storedValue
              : systemTheme;

          const themeColor = theme === "dark" ? "#141413" : "#faf9f5";
          const themeColorMeta = document.querySelector('meta[name="theme-color"]');

          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          themeColorMeta?.setAttribute("content", themeColor);
        } catch {
          const fallbackTheme = window.matchMedia("(prefers-color-scheme: dark)")
            .matches
            ? "dark"
            : "light";
          const fallbackThemeColor =
            fallbackTheme === "dark" ? "#141413" : "#faf9f5";
          const themeColorMeta = document.querySelector('meta[name="theme-color"]');

          document.documentElement.dataset.theme = fallbackTheme;
          document.documentElement.style.colorScheme = fallbackTheme;
          themeColorMeta?.setAttribute("content", fallbackThemeColor);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

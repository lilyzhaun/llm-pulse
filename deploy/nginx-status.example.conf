# Define these in the http context, for example in /etc/nginx/conf.d/llm-pulse-status.conf.
limit_req_zone $binary_remote_addr zone=llm_pulse_status_api:10m rate=5r/s;

# If Cloudflare terminates client HTTPS and connects to the origin over HTTP,
# preserve the external scheme for upstream logs and avoid redirect loops.
map $http_cf_visitor $llm_pulse_forwarded_proto {
    default $scheme;
    ~*"scheme":"https" https;
}

server {
    listen 80;
    # Replace status.example.com with the real public hostname for your deployment.
    server_name status.example.com;
    client_max_body_size 20m;

    # Keep the existing root site behavior unchanged on HTTP.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }

    # Redirect plain HTTP /status traffic to HTTPS, while avoiding Cloudflare HTTPS-to-origin redirect loops.
    location = /status {
        if ($http_cf_visitor !~* '"scheme":"https"') {
            return 308 https://$host/status/;
        }
        return 308 https://$host/status/;
    }

    # Metrics are for local Prometheus or host-level checks only.
    # Add explicit Prometheus scraper IPs here before deny all if needed.
    location = /status/api/metrics {
        if ($http_cf_visitor !~* '"scheme":"https"') {
            return 308 https://$host$request_uri;
        }

        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:43130;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $llm_pulse_forwarded_proto;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }

    # LLM Pulse dashboard and public read-only API.
    location ^~ /status/ {
        if ($http_cf_visitor !~* '"scheme":"https"') {
            return 308 https://$host$request_uri;
        }

        limit_req zone=llm_pulse_status_api burst=20 nodelay;
        limit_req_status 429;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Start with Report-Only CSP to observe breakage before enforcing.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

        proxy_pass http://127.0.0.1:43130;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $llm_pulse_forwarded_proto;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    # Replace status.example.com with the real public hostname for your deployment.
    server_name status.example.com;
    client_max_body_size 20m;

    # Replace these placeholder TLS paths with certificates managed by your deployment.
    ssl_certificate /etc/ssl/certs/llm-pulse-status.example.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/llm-pulse-status.example.privkey.pem;
    # Optional: include your platform's hardened SSL parameters if available.
    include /etc/nginx/snippets/ssl-params.conf;
    # Optional: set this only if your SSL profile requires a DH parameter file.
    ssl_dhparam /etc/nginx/dhparam.pem;

    # Keep the existing root site behavior unchanged on HTTPS.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }

    # Normalize /status to /status/ so frontend relative paths resolve correctly.
    location = /status {
        return 308 https://$host/status/;
    }

    # Metrics are for local Prometheus or host-level checks only.
    # Add explicit Prometheus scraper IPs here before deny all if needed.
    location = /status/api/metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:43130;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }

    # LLM Pulse dashboard and public read-only API.
    location ^~ /status/ {
        limit_req zone=llm_pulse_status_api burst=20 nodelay;
        limit_req_status 429;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Start with Report-Only CSP to observe breakage before enforcing.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

        proxy_pass http://127.0.0.1:43130;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }
}
